<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Ace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column of big tappable "cards"; one screen visible at a time, Finn the fox always on stage. */
:root {
  --sky: #dff1fb;
  --paper: #ffffff;
  --ink: #1f3448;
  --soft: #5a7186;
  --leaf: #2f9e6a;
  --sun: #ffc94a;
  --fox: #f07c2a;
  --line: #c7dce8;
  --tint: #eef7fc;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Lexend", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #12202c; --paper: #1b2d3c; --ink: #eaf3f9; --soft: #a6bccb;
    --leaf: #4fc58c; --sun: #ffd56e; --fox: #ff9448; --line: #2d4558; --tint: #22374a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #12202c; --paper: #1b2d3c; --ink: #eaf3f9; --soft: #a6bccb;
  --leaf: #4fc58c; --sun: #ffd56e; --fox: #ff9448; --line: #2d4558; --tint: #22374a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--body); font-size: 20px; line-height: 1.6; letter-spacing: 0.02em;
}
.app {
  max-width: 680px; margin: 0 auto; min-height: 100%;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 28px; margin: 0; }
.brand span { color: var(--fox); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
.icon-btn {
  width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--paper); display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 28px; height: 28px; }
.stage {
  background: var(--paper); border-radius: 28px; border: 2px solid var(--line);
  overflow: hidden;
}
.scene { display: block; width: 100%; height: auto; max-width: 100%; }
.talk { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.say { font-size: 24px; font-weight: 500; margin: 0; text-wrap: balance; }
.hint { color: var(--soft); font-size: 17px; margin: 0; }
.choices { display: grid; gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 72px; padding: 12px 16px; border-radius: 20px;
  border: 3px solid var(--line); background: var(--tint);
}
.choice .pic { font-size: 34px; line-height: 1; flex: none; width: 44px; text-align: center; }
.choice.picked-good { border-color: var(--leaf); }
.choice.picked-try { border-color: var(--sun); }
.feelings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.feel { flex-direction: column; justify-content: center; text-align: center; gap: 6px; font-size: 17px; }
.feel .pic { font-size: 40px; width: auto; }
.big {
  min-height: 72px; border-radius: 22px; border: none; padding: 12px 24px;
  background: var(--leaf); color: #fff; font-family: var(--display); font-size: 26px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.big.alt { background: var(--paper); color: var(--ink); border: 3px solid var(--line); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 200px; }
.speech {
  font-family: var(--display); font-size: 40px; font-weight: 600; text-align: center;
  background: var(--sun); color: #3a2a00; border-radius: 24px; padding: 14px; margin: 0;
}
.home-grid { display: grid; gap: 14px; }
.tile {
  display: flex; align-items: center; gap: 16px; text-align: left;
  background: var(--paper); border: 3px solid var(--line); border-radius: 26px;
  padding: 16px 18px; min-height: 96px;
}
.tile .pic { font-size: 46px; line-height: 1; width: 56px; text-align: center; flex: none; }
.tile b { font-family: var(--display); font-size: 26px; font-weight: 600; display: block; line-height: 1.2; }
.tile small { color: var(--soft); font-size: 16px; }
.cat { display: flex; flex-direction: column; gap: 10px; }
.cat-title { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 10px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  background: var(--paper); border: 3px solid var(--line); border-radius: 22px; padding: 14px; min-height: 132px; min-width: 0;
}
.card .pic { font-size: 36px; line-height: 1.1; }
.card b { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.card small { color: var(--soft); font-size: 14px; line-height: 1.35; }
.card.game { background: var(--tint); }
.done { color: var(--fox); font-weight: 600; }
.stars { color: var(--fox); font-family: var(--display); font-size: 20px; }
.ladder { display: flex; flex-direction: column-reverse; gap: 10px; }
.rung {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--paper); border: 3px solid var(--line); border-radius: 20px;
  padding: 12px 16px; min-height: 76px;
}
.rung .num {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--tint); font-family: var(--display); font-weight: 600; font-size: 22px;
}
.rung.done { border-color: var(--leaf); }
.rung.done .num { background: var(--leaf); color: #fff; }
.rung .txt { flex: 1; min-width: 0; }
.rung .star { font-size: 30px; flex: none; opacity: 0.25; }
.rung.done .star { opacity: 1; }
.grown { background: var(--paper); border-radius: 24px; border: 2px solid var(--line); padding: 20px 22px; font-size: 17px; }
.grown h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0 0 8px; }
.grown h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 18px 0 4px; }
.grown p, .grown li { max-width: 62ch; }
.grown ul { padding-left: 22px; margin: 4px 0; }
.small-btn { border: 2px solid var(--line); background: var(--tint); border-radius: 14px; padding: 10px 16px; font-size: 16px; min-height: 48px; }
.progress { display: flex; gap: 8px; justify-content: center; }
.progress i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.progress i.on { background: var(--fox); }
.go-btn { background: var(--leaf); }
.stop-btn { background: #d9534f; }
.lights { display: grid; gap: 10px; }
.light {
  display: flex; align-items: center; gap: 14px; text-align: left; min-height: 72px;
  padding: 10px 16px; border-radius: 20px; border: 3px solid var(--line); background: var(--tint); font-size: 17px;
}
.light b { display: block; font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.2; }
.light:disabled { opacity: .45; cursor: default; }
.light .bulb { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--line); transition: background .2s; }
.light.red.lit .bulb { background: #e5484d; }
.light.amber.lit .bulb { background: #f5a524; }
.light.green.lit .bulb { background: #30a46c; }
.light.step .bulb { display: grid; place-items: center; font-size: 26px; opacity: .5; }
.light.step.lit .bulb { background: var(--sun); opacity: 1; }
.light.lit { border-color: var(--ink); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.pop { animation: pop .5s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Home" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    </button>
    <h1 class="brand">Social <span>Ace</span></h1>
    <button class="icon-btn" id="speakBtn" aria-label="Read it to me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </div>
  <main id="view"></main>
</div>

<script>
/* ---------- tiny helpers ---------- */
const $view = document.getElementById('view');
const homeBtn = document.getElementById('homeBtn');
let currentLine = '';

function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem('socialace.' + key));
    localStorage.setItem('socialace.' + key, JSON.stringify(val));
  } catch (e) { return null; }
}

let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === 'en-GB') || vs.find(v => v.lang && v.lang.startsWith('en')) || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

function speak(text) {
  currentLine = text || currentLine;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(currentLine);
    if (voice) u.voice = voice;
    u.lang = 'en-GB'; u.rate = 0.88; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.getElementById('speakBtn').onclick = () => speak();
homeBtn.onclick = () => showHome();

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; }

/* ---------- Finn the fox (drawn in code) ---------- */
function fox(mood) {
  const mouths = {
    happy: '<path d="M88 132 q12 12 24 0" stroke="#3b2414" stroke-width="4" fill="none" stroke-linecap="round"/>',
    big:   '<path d="M84 128 q16 22 32 0 z" fill="#3b2414"/>',
    wobbly:'<path d="M86 134 q5 -5 10 0 t10 0 t10 0" stroke="#3b2414" stroke-width="4" fill="none" stroke-linecap="round"/>',
    calm:  '<path d="M90 133 h20" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/>',
    cross: '<path d="M88 138 q12 -10 24 0" stroke="#3b2414" stroke-width="4" fill="none" stroke-linecap="round"/>',
    sad:   '<path d="M88 138 q12 -10 24 0" stroke="#3b2414" stroke-width="4" fill="none" stroke-linecap="round"/>'
  };
  const brows = mood === 'wobbly'
    ? '<path d="M70 92 l14 4 M130 92 l-14 4" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/>'
    : mood === 'cross'
    ? '<path d="M70 88 l16 8 M130 88 l-16 8" stroke="#3b2414" stroke-width="5" stroke-linecap="round"/><path d="M40 60 l-8 -10 M160 60 l8 -10 M46 48 l-4 -14" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>'
    : mood === 'sad'
    ? '<path d="M70 96 l14 -5 M130 96 l-14 -5" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/><path d="M122 112 q4 10 0 13 q-4 -3 0 -13" fill="#6ec3f0"/>' : '';
  return `<g>
    <path d="M52 70 L66 18 L92 58 Z" fill="var(--fox)"/><path d="M60 62 L67 32 L82 56 Z" fill="#ffe3cc"/>
    <path d="M148 70 L134 18 L108 58 Z" fill="var(--fox)"/><path d="M140 62 L133 32 L118 56 Z" fill="#ffe3cc"/>
    <ellipse cx="100" cy="104" rx="56" ry="50" fill="var(--fox)"/>
    <path d="M62 112 Q100 170 138 112 Q120 128 100 128 Q80 128 62 112 Z" fill="#fff6ee"/>
    <circle cx="80" cy="102" r="7" fill="#3b2414"/><circle cx="120" cy="102" r="7" fill="#3b2414"/>
    <circle cx="82" cy="99" r="2.4" fill="#fff"/><circle cx="122" cy="99" r="2.4" fill="#fff"/>
    ${brows}
    <ellipse cx="100" cy="120" rx="7" ry="5" fill="#3b2414"/>
    ${mouths[mood] || mouths.happy}
    <circle cx="68" cy="122" r="7" fill="#ff8f8f" opacity=".45"/><circle cx="132" cy="122" r="7" fill="#ff8f8f" opacity=".45"/>
    <path d="M70 152 Q100 168 130 152 L136 200 L64 200 Z" fill="#3c7dd9"/>
  </g>`;
}

function kid(x, color, hair, mood = 'happy', s = 1) {
  const mouth = {
    happy: '<path d="M-6 128 q6 6 12 0" stroke="#3b2414" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    laugh: '<path d="M-8 126 q8 12 16 0 z" fill="#3b2414"/>',
    cross: '<path d="M-6 131 q6 -5 12 0" stroke="#3b2414" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    sad:   '<path d="M-6 132 q6 -6 12 0" stroke="#3b2414" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
    meh:   '<path d="M-5 129 h10" stroke="#3b2414" stroke-width="2.5" stroke-linecap="round"/>'
  }[mood];
  const brows = mood === 'cross' ? '<path d="M-12 111 l8 4 M12 111 l-8 4" stroke="#3b2414" stroke-width="2.5" stroke-linecap="round"/>'
    : mood === 'sad' ? '<path d="M-12 115 l8 -3 M12 115 l-8 -3" stroke="#3b2414" stroke-width="2.5" stroke-linecap="round"/><path d="M8 124 q2 6 0 8 q-2 -2 0 -8" fill="#6ec3f0"/>' : '';
  const arms = mood === 'cross' ? `<rect x="-24" y="156" width="48" height="10" rx="5" fill="#f2c9a5"/>`
    : mood === 'laugh' ? '<path d="M-22 146 l-14 -18 M22 146 l14 -18" stroke="#f2c9a5" stroke-width="8" stroke-linecap="round"/>' : '';
  return `<g transform="translate(${x} ${200 - 200 * s}) scale(${s})">
    <circle cx="0" cy="118" r="20" fill="#f2c9a5"/>
    <path d="M-20 112 q20 -26 40 0" fill="${hair}"/>
    <circle cx="-7" cy="120" r="2.6" fill="#3b2414"/><circle cx="7" cy="120" r="2.6" fill="#3b2414"/>
    ${brows}${mouth}
    <path d="M-22 140 h44 l6 60 h-56 z" fill="${color}"/>${arms}
  </g>`;
}

function scene(place, mood, extra) {
  const bg = {
    park: `<rect width="600" height="260" fill="#bfe6fb"/><circle cx="520" cy="54" r="30" fill="#ffd45a"/>
           <rect y="190" width="600" height="70" fill="#8ccf6e"/><circle cx="60" cy="150" r="48" fill="#5fae4a"/><rect x="54" y="160" width="12" height="40" fill="#8a5a33"/>`,
    school: `<rect width="600" height="260" fill="#fbe9c9"/><rect x="250" y="34" width="220" height="110" rx="8" fill="#2f5d50"/>
             <path d="M270 70 h60 M270 96 h110" stroke="#e8f2ee" stroke-width="5" stroke-linecap="round"/>
             <rect y="200" width="600" height="60" fill="#d6b48a"/><rect x="40" y="40" width="120" height="90" rx="6" fill="#9fd3f0" stroke="#fff" stroke-width="6"/>`,
    lunch: `<rect width="600" height="260" fill="#e4e0f7"/><rect x="30" y="30" width="540" height="12" fill="#c9c2ee"/>
            <rect y="196" width="600" height="64" fill="#b78f6a"/><rect y="190" width="600" height="12" rx="4" fill="#9c7653"/>
            <rect x="330" y="176" width="44" height="16" rx="4" fill="#ffd45a"/>`,
    party: `<rect width="600" height="260" fill="#fde2ec"/>
            <path d="M0 30 Q150 70 300 30 T600 30" stroke="#b05" stroke-width="2" fill="none"/>
            ${[20,80,140,200,260,320,380,440,500,560].map((x, k) => `<path d="M${x} ${38 + Math.sin(x / 95) * 16} l14 0 l-7 18 z" fill="${['#ffc94a','#4fc58c','#5aa0f0','#f07c2a'][k % 4]}"/>`).join('')}
            <circle cx="560" cy="110" r="18" fill="#5aa0f0"/><path d="M560 128 v40" stroke="#888" stroke-width="2"/>
            <circle cx="40" cy="120" r="18" fill="#f07c2a"/><path d="M40 138 v40" stroke="#888" stroke-width="2"/>
            <rect y="200" width="600" height="60" fill="#e7c9a6"/>`,
    club:  `<rect width="600" height="260" fill="#e3edf2"/><rect x="20" y="30" width="80" height="160" fill="#cfdce4"/>
            <path d="M20 60 h80 M20 90 h80 M20 120 h80 M20 150 h80" stroke="#b5c6d1" stroke-width="4"/>
            <rect y="196" width="600" height="64" fill="#4f86c6"/><rect x="200" y="196" width="400" height="64" fill="#6aa0dc"/>`,
    home:  `<rect width="600" height="260" fill="#f3ead9"/><rect x="380" y="40" width="150" height="100" rx="6" fill="#bfe6fb" stroke="#fff" stroke-width="8"/>
            <path d="M455 40 v100 M380 90 h150" stroke="#fff" stroke-width="6"/>
            <rect x="20" y="120" width="120" height="70" rx="14" fill="#c9845a"/><rect x="30" y="100" width="100" height="40" rx="12" fill="#d99a72"/>
            <rect y="196" width="600" height="64" fill="#b98f6a"/>`
  }[place];
  return `<svg class="scene" viewBox="0 0 600 260" role="img" aria-label="Finn the fox">
    ${bg}${extra || ''}<g transform="translate(150 56) scale(1)">${fox(mood)}</g></svg>`;
}

const ball = '<circle cx="470" cy="206" r="16" fill="#fff" stroke="#333" stroke-width="3"/>';
const parkKids = kid(400, '#e0533d', '#4a2f1d') + kid(520, '#7a4fd1', '#e8b545') + ball;
const classKids = kid(470, '#2a9d8f', '#1c1c1c') + kid(550, '#e76f51', '#a0522d');
const sam = mood => kid(470, '#2a9d8f', '#1c1c1c', mood);

/* ---------- stories ---------- */
const STORIES = [
  {
    id: 'park', cat: 'join', pic: '⚽', title: 'Joining a game', where: 'At the park', place: 'park', extra: parkKids,
    steps: [
      { type: 'tell', mood: 'calm', say: 'This is Finn. Finn is at the park. Some children are playing football.' },
      { type: 'feel', say: 'Finn wants to play, but he does not know them. How do you think Finn feels?',
        reply: 'Lots of people feel a bit wobbly when they meet new children. That is OK. Feelings can be big, and we can still be brave.' },
      { type: 'choose', mood: 'wobbly', say: 'What could Finn do?', options: [
        { pic: '👀', text: 'Watch for a bit, then walk closer', good: true, reply: 'Great idea! Watching first helps Finn see how the game works. Now he is ready.' },
        { pic: '🏃', text: 'Run home', reply: 'That is OK. But then Finn misses the fun. Let us try another way.' },
        { pic: '🤲', text: 'Grab the ball', reply: 'Oh! The children look surprised. Grabbing does not feel friendly. Let us try another way.' }
      ]},
      { type: 'practise', mood: 'happy', words: 'Can I play?', say: 'Finn uses his brave words. Can you say them with Finn? Say it out loud: Can I play?' },
      { type: 'tell', mood: 'big', say: 'The children say: Yes! You can be in goal!' },
      { type: 'choose', mood: 'happy', say: 'What should Finn do now?', options: [
        { pic: '😊', text: 'Smile and say thanks', good: true, reply: 'Yes! A smile and a thank you makes new friends feel happy too.' },
        { pic: '👟', text: 'Look at his feet and say nothing', reply: 'That is OK when you feel shy. A small smile can help. Let us try that.' }
      ]},
      { type: 'done', mood: 'big', say: 'Finn was brave! He joined the game. You helped him. You earned a star!' }
    ]
  },
  {
    id: 'hiback', cat: 'hi', pic: '👋', title: 'Saying hi back', where: 'At the school gate', place: 'school', extra: sam('laugh'),
    steps: [
      { type: 'tell', mood: 'calm', say: 'It is the morning at school. Sam waves and says: Hi Finn!' },
      { type: 'tell', mood: 'wobbly', extra: sam('meh'), say: 'Finn feels shy. He looks at the floor and says hi really fast. Sam walks away.' },
      { type: 'choose', mood: 'wobbly', extra: sam('sad'), say: 'How do you think Sam feels now?', options: [
        { pic: '😔', text: 'Sad. He thinks Finn doesn\'t like him', good: true, reply: 'Yes. Sam can\'t tell that Finn feels shy inside. He might think Finn does not want to be friends.' },
        { pic: '😀', text: 'Happy', reply: 'Look at Sam\'s face. He looks sad. When we look away, people can think we don\'t like them.' }
      ]},
      { type: 'lights', mood: 'happy', extra: sam('happy'), say: 'Here is the hi back recipe. Tap each one.', items: [
        { cls: 'step', pic: '👀', title: 'Look up', sub: 'At their eyebrows or nose. That counts!' },
        { cls: 'step', pic: '😊', title: 'Smile', sub: 'A small smile is fine' },
        { cls: 'step', pic: '🗣️', title: 'Say their name', sub: 'Hi Sam! Nice and slow' }
      ]},
      { type: 'practise', mood: 'happy', extra: sam('happy'), words: 'Hi Sam!', say: 'Now you try. Look up, smile, and say it slowly: Hi Sam!' },
      { type: 'choose', mood: 'happy', extra: sam('happy'), say: 'Super brave level! Finn can add one more thing. Which one?', options: [
        { pic: '❓', text: 'Hi Sam! Did you have a good weekend?', good: true, reply: 'Brilliant! A question keeps the chat going.' },
        { pic: '⚽', text: 'Hi Sam! Want to play at break?', good: true, reply: 'Brilliant! That is how friendships start.' },
        { pic: '👋', text: 'Just: Hi Sam! and a wave', good: true, reply: 'That is great too. Hi and their name is plenty.' }
      ]},
      { type: 'tell', mood: 'big', extra: sam('laugh'), say: 'Sam grins. He sits next to Finn at carpet time.' },
      { type: 'done', mood: 'big', extra: sam('laugh'), say: 'Look up, smile, say their name. You know the hi back recipe! You earned a star!' }
    ]
  },
  {

/* Spot the signal: quick rounds, instant feedback */
const SIGNALS = [
  { mood: 'laugh', line: 'Sam is laughing and throws the ball back to you.', go: true },
  { mood: 'cross', line: 'Sam crosses his arms and says, stop it.', go: false },
  { mood: 'happy', line: 'Sam smiles and says, again! Do it again!', go: true },
  { mood: 'sad', line: 'Sam looks sad and goes quiet.', go: false },
  { mood: 'meh', line: 'Sam turns away and talks to someone else.', go: false },
  { mood: 'laugh', line: 'Sam is laughing and copying your silly dance.', go: true },
  { mood: 'cross', line: 'Sam\'s face goes red and he moves away from you.', go: false },
  { mood: 'happy', line: 'Sam asks, can I have a turn?', go: true }
];

const LADDER = [
  'Wave to someone you know',
  'When a boy says hi: look up, smile, say hi and his name',
  'Say hi to a shop helper or librarian',
  'Ask a grown-up a question at a club',
  'Say hi to a child in your class you don\'t play with yet',
  'At break, suggest a game you like to someone',
  'Ask a child: Can I play?',
  'In a game, stop and ask: Is this still fun?'
];

const CATS = [
  { id: 'hi', pic: '👋', title: 'Saying hi' },
  { id: 'join', pic: '🙋', title: 'Joining in' },
  { id: 'faces', pic: '👀', title: 'Reading faces' },
  { id: 'friends', pic: '🤝', title: 'Keeping friends' },
  { id: 'tricky', pic: '🧭', title: 'Tricky moments' }
];

/* ---------- screens ---------- */
function showHome() {
  homeBtn.hidden = true;
  const stars = store('stars') || {};
  const ladder = store('ladder') || [];
  const total = Object.values(stars).reduce((a, b) => a + b, 0) + ladder.length;
  $view.replaceChildren(el(`
    <div class="home-grid">
      <div class="stage">${scene('park', 'big', '')}
        <div class="talk"><p class="say">Hi! I'm Finn. Let's practise being brave together.</p>
        <p class="stars" aria-label="${total} stars">★ ${total} star${total === 1 ? '' : 's'}</p></div>
      </div>
      ${CATS.map(c => `
        <section class="cat" aria-labelledby="cat-${c.id}">
          <h2 class="cat-title" id="cat-${c.id}"><span aria-hidden="true">${c.pic}</span> ${c.title}</h2>
          <div class="cards">
            ${c.id === 'faces' ? `<button class="card game" data-go="signals">
              <span class="pic" aria-hidden="true">🚦</span><b>Spot the signal</b><small>Quick game${stars.signals ? ' · <span class="done">★</span>' : ''}</small>
            </button>` : ''}
            ${STORIES.filter(s => s.cat === c.id).map(s => `
              <button class="card" data-story="${s.id}">
                <span class="pic" aria-hidden="true">${s.pic}</span><b>${s.title}</b><small>${s.where}${stars[s.id] ? ' · <span class="done">★</span>' : ''}</small>
              </button>`).join('')}
          </div>
        </section>`).join('')}
      <h2 class="cat-title"><span aria-hidden="true">🌟</span> Real life</h2>
      <button class="tile" data-go="ladder">
        <span class="pic" aria-hidden="true">🪜</span>
        <span><b>Brave ladder</b><small>Real-life missions · ${ladder.length} of ${LADDER.length}</small></span>
      </button>
      <button class="tile" data-go="grown">
        <span class="pic" aria-hidden="true">🧑‍🧒</span>
        <span><b>For grown-ups</b><small>How to use Social Ace</small></span>
      </button>
    </div>`));
  $view.querySelectorAll('[data-story]').forEach(b => b.onclick = () => startStory(b.dataset.story));
  $view.querySelector('[data-go="ladder"]').onclick = showLadder;
  $view.querySelector('[data-go="signals"]').onclick = () => showSignals(0, 0, shuffle(SIGNALS).slice(0, 6));
  $view.querySelector('[data-go="grown"]').onclick = showGrown;
  currentLine = "Hi! I'm Finn. Let's practise being brave together. Pick a story.";
}

function startStory(id) {
  const story = STORIES.find(s => s.id === id);
  homeBtn.hidden = false;
  showStep(story, 0);
}

let chosenGame = 'tag';
const fill = s => (s || '').replace(/\{game\}/g, chosenGame);

function showStep(story, i) {
  if (i === 0) chosenGame = 'tag';
  const raw = story.steps[i];
  const step = { ...raw, say: fill(raw.say), words: fill(raw.words) };
  const next = () => showStep(story, i + 1);
  const dots = story.steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
  const mood = step.mood || 'calm';
  let body = '';

  if (step.type === 'tell' || step.type === 'done') {
    body = `<p class="say">${step.say}</p>
      ${step.type === 'done' ? '<p class="speech pop" aria-hidden="true">★</p>' : ''}
      <button class="big" id="go">${step.type === 'done' ? 'Back home' : 'Next ➜'}</button>`;
  } else if (step.type === 'feel') {
    body = `<p class="say">${step.say}</p>
      <div class="feelings">
        ${[['😀', 'Happy'], ['😬', 'Wobbly'], ['😟', 'Scared']].map(([p, t]) =>
          `<button class="choice feel"><span class="pic" aria-hidden="true">${p}</span>${t}</button>`).join('')}
      </div>
      <p class="hint" id="reply" hidden></p>
      <button class="big" id="go" hidden>Next ➜</button>`;
  } else if (step.type === 'choose') {
    body = `<p class="say">${step.say}</p>
      <div class="choices">
        ${step.options.map((o, k) => `<button class="choice" data-k="${k}"><span class="pic" aria-hidden="true">${o.pic}</span>${o.text}</button>`).join('')}
      </div>
      <p class="say" id="reply" hidden></p>
      <button class="big" id="go" hidden>Next ➜</button>`;
  } else if (step.type === 'lights') {
    body = `<p class="say">${step.say}</p>
      <div class="lights">
        ${step.items.map((it, k) => `<button class="light ${it.cls}" data-k="${k}" ${k ? 'disabled' : ''}>
          <span class="bulb" aria-hidden="true">${it.pic || ''}</span><span><b>${it.title}</b>${it.sub}</span></button>`).join('')}
      </div>
      <button class="big" id="go" hidden>Next ➜</button>`;
  } else if (step.type === 'practise') {
    body = `<p class="say">Finn's brave words:</p>
      <p class="speech">${step.words}</p>
      <div class="row">
        <button class="big alt" id="hear">🔊 Hear it</button>
        <button class="big" id="go">I said it! ✓</button>
      </div>`;
  }

  $view.replaceChildren(el(`
    <div class="stage">${scene(story.place, mood, step.extra || story.extra)}
      <div class="talk">${body}<div class="progress" aria-hidden="true">${dots}</div></div>
    </div>`));
  speak(step.say);

  const go = $view.querySelector('#go');
  const reply = $view.querySelector('#reply');

  if (step.type === 'done') {
    const stars = store('stars') || {};
    stars[story.id] = 1; store('stars', stars);
    go.onclick = showHome;
  } else if (step.type === 'feel') {
    $view.querySelectorAll('.feel').forEach(b => b.onclick = () => {
      $view.querySelectorAll('.feel').forEach(x => x.classList.remove('picked-good'));
      b.classList.add('picked-good');
      reply.textContent = step.reply; reply.hidden = false; go.hidden = false;
      speak(step.reply);
    });
    go.onclick = next;
  } else if (step.type === 'choose') {
    $view.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const o = step.options[+b.dataset.k];
      if (o.set) {
        chosenGame = o.set;
        $view.querySelectorAll('.choice').forEach(x => x.classList.remove('picked-good'));
      }
      b.classList.add(o.good ? 'picked-good' : 'picked-try');
      reply.textContent = o.reply; reply.hidden = false;
      go.hidden = !o.good;
      speak(o.reply);
    });
    go.onclick = next;
  } else if (step.type === 'lights') {
    const btns = $view.querySelectorAll('.light');
    btns.forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      b.classList.add('lit'); speak(step.items[k].title + '. ' + step.items[k].sub);
      if (btns[k + 1]) btns[k + 1].disabled = false; else go.hidden = false;
    });
    go.onclick = next;
  } else if (step.type === 'practise') {
    $view.querySelector('#hear').onclick = () => speak(step.words);
    go.onclick = () => { speak('Brilliant! That was brave.'); setTimeout(next, 1400); };
  } else {
    go.onclick = next;
  }
}

function shuffle(a) { return a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]); }

function showSignals(i, score, rounds) {
  homeBtn.hidden = false;
  if (i >= rounds.length) {
    const stars = store('stars') || {}; stars.signals = 1; store('stars', stars);
    $view.replaceChildren(el(`
      <div class="stage">${scene('park', 'big', '')}
        <div class="talk"><p class="say">You spotted ${score} out of ${rounds.length} signals!</p>
        <p class="speech pop" aria-hidden="true">★</p>
        <div class="row"><button class="big alt" id="again">Play again</button><button class="big" id="home">Back home</button></div></div>
      </div>`));
    speak(`You spotted ${score} out of ${rounds.length} signals! You earned a star!`);
    $view.querySelector('#again').onclick = () => showSignals(0, 0, shuffle(SIGNALS).slice(0, 6));
    $view.querySelector('#home').onclick = showHome;
    return;
  }
  const r = rounds[i];
  const dots = rounds.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
  $view.replaceChildren(el(`
    <div class="stage">
      <svg class="scene" viewBox="0 0 600 260" role="img" aria-label="Sam">
        <rect width="600" height="260" fill="#bfe6fb"/><rect y="200" width="600" height="60" fill="#8ccf6e"/>
        ${kid(300, '#2a9d8f', '#1c1c1c', r.mood, 1.25)}
      </svg>
      <div class="talk">
        <p class="say">${r.line}</p>
        <div class="row">
          <button class="big go-btn" data-a="1">👍 Keep playing</button>
          <button class="big stop-btn" data-a="0">✋ Stop and check</button>
        </div>
        <p class="say" id="reply" hidden></p>
        <button class="big alt" id="go" hidden>Next ➜</button>
        <div class="progress" aria-hidden="true">${dots}</div>
      </div>
    </div>`));
  speak(r.line + ' Keep playing, or stop and check?');
  const reply = $view.querySelector('#reply'), go = $view.querySelector('#go');
  let answered = false;
  $view.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const right = (b.dataset.a === '1') === r.go;
    const why = r.go ? 'Sam is having fun.' : 'Sam is not having fun. Stop and ask: are you OK?';
    reply.textContent = (right ? 'Yes! ' : 'Not this time. ') + why;
    reply.hidden = false; go.hidden = false;
    speak(reply.textContent);
    go.onclick = () => showSignals(i + 1, score + (right ? 1 : 0), rounds);
  });
}

function showLadder() {
  homeBtn.hidden = false;
  const done = store('ladder') || [];
  $view.replaceChildren(el(`
    <div class="talk" style="padding:0">
      <p class="say">Brave ladder</p>
      <p class="hint">Do these in real life with a grown-up. Start at the bottom. Tap a step when you've done it.</p>
    </div>
    <div class="ladder" style="margin-top:14px">
      ${LADDER.map((t, k) => `
        <button class="rung ${done.includes(k) ? 'done' : ''}" data-k="${k}">
          <span class="num">${k + 1}</span><span class="txt">${t}</span><span class="star" aria-hidden="true">★</span>
        </button>`).join('')}
    </div>`));
  currentLine = 'Brave ladder. Do these in real life with a grown-up. Start at the bottom. ' + LADDER.join('. ');
  $view.querySelectorAll('.rung').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    const list = store('ladder') || [];
    const has = list.includes(k);
    const nextList = has ? list.filter(x => x !== k) : [...list, k];
    store('ladder', nextList);
    b.classList.toggle('done', !has);
    if (!has) { b.querySelector('.star').classList.add('pop'); speak('You did it! ' + LADDER[k] + '. That was brave!'); }
    else speak(LADDER[k]);
  });
}

function showGrown() {
  homeBtn.hidden = false;
  $view.replaceChildren(el(`
    <div class="grown">
      <h2>For grown-ups</h2>
      <p>Social Ace helps a shy child rehearse social moments before they happen. Everything is read aloud, so your child doesn't need to read. Tap the speaker at the top to hear any screen again.</p>
      <h3>How to use it</h3>
      <ul>
        <li>Sit together for 5–10 minutes. One story is enough.</li>
        <li>Talk about the story afterwards: "When could you say 'Can I play?'"</li>
        <li>Before a party or new club, play the matching story that day.</li>
        <li>Use the Brave ladder for real-life practice. Start small and praise the effort, not the outcome.</li>
      </ul>
      <h3>If he blanks children who say hi</h3>
      <p>Shy children often look down and rush their reply, and the other child can read that as "he doesn't like me". "Saying hi back" teaches a three-part recipe: look up, smile, say their name.</p>
      <ul>
        <li>Full eye contact isn't needed. Looking at eyebrows or the nose is easier and looks the same to the other child.</li>
        <li>Help him learn the names of the boys who say hi. A name makes "hi" feel friendly.</li>
        <li>Practise at home: say "Hi!" to each other at the door and try the recipe.</li>
        <li>Afterwards, notice it: "I saw you say hi to Sam. He looked pleased."</li>
      </ul>
      <h3>If he doesn't like football</h3>
      <p>"Not football today" gives him a kind way to say no and suggest something else. It also covers what to do if the other child says no. Help him by asking his teacher which classmates aren't into football, looking for lunchtime clubs, and inviting one child at a time to play at home.</p>
      <h3>If he winds other children up</h3>
      <p>Winding people up is often a way of trying to connect when starting a conversation feels hard. "Is it still funny?" and "Spot the signal" practise noticing when the other child has stopped enjoying it. Use the same words at home: "Stop, look, think. Is your friend still having fun?"</p>
      <h3>About this prototype</h3>
      <p>No sign-in, no ads, no chat. Progress is kept only on this device.</p>
      <button class="small-btn" id="reset">Reset stars and ladder</button>
      <p class="hint" id="resetMsg" hidden>Progress cleared.</p>
    </div>`));
  currentLine = 'For grown-ups. Social Ace helps a shy child rehearse social moments before they happen.';
  $view.querySelector('#reset').onclick = () => {
    store('stars', {}); store('ladder', []);
    $view.querySelector('#resetMsg').hidden = false;
  };
}

document.addEventListener('DOMContentLoaded', showHome);
</script>
<script src="stories.js"></script>
